<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINSAY — You're Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #E8EDF2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #232323;
    }
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 48px 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0F172A;
    }
    p {
      font-size: 14px;
      color: #6B7280;
      line-height: 20px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #005EEC;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #004BC7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection and try again.</p>
    <a href="/" class="btn">Try Again</a>
  </div>
</body>
</html>
